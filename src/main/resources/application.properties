spring.application.name=LibraryRestServer
server.port = 9001

### Datasource Configuration ###
spring.datasource.name=library_db
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.url=jdbc:h2:file:./src/main/resources/database/library_db
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.encoding=UTF-8
spring.sql.init.data-locations=classpath:data/categories.sql

### HIBERNATE CONFIGURATION ###
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.H2Dialect

### ENABLE H2 DATABASE CONSOLE ###
spring.h2.console.enabled=true

#Logs configurations #
logging.level.root =ERROR
logging.level.org.springframework.boot.web.embedded.tomcat=INFO

